name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PortfolioTracker.slnx

      - name: Build
        run: dotnet build PortfolioTracker.slnx --no-restore

      - name: Test
        run: dotnet test tests/PortfolioTracker.Tests --no-build --verbosity normal

services:
  api:
    build:
      context: ./src/PortfolioTracker.Api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - ConnectionStrings__Default=Host=postgres;Database=portfolio;Username=postgres;Password=postgres
      - TwelveDataApiKey=${TWELVEDATA_API_KEY:-}
      - FmpApiKey=${FMP_API_KEY:-}
      - EodApiKey=${EOD_API_KEY:-}
    networks:
      - portfolio-network

  blazor:
    build:
      context: ./src/PortfolioTracker.Blazor
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiBaseUrl=http://api:8080
    networks:
      - portfolio-network

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - portfolio-network
   
  mcp-pandas:
    build:
      context: ./mcp-pandas
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    volumes:
      - ./data:/data
      - ./csv:/csv:ro
    networks:
      - portfolio-network

volumes:
  postgres_data:

networks:
  portfolio-network:
    driver: bridge

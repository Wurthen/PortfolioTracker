services:
  api:
    build:
      context: ./src/PortfolioTracker.Api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__Default=Host=postgres;Database=portfolio;Username=postgres;Password=postgres
      - TwelveDataApiKey=${TWELVEDATA_API_KEY:-}
      - FmpApiKey=${FMP_API_KEY:-}
      - EodApiKey=${EOD_API_KEY:-}
      - AlpacaApiKey=${ALPACA_API_KEY:-}
      - AlpacaSecretKey=${ALPACA_SECRET_KEY:-}
    networks:
      - portfolio-network

  blazor:
    build:
      context: ./src/PortfolioTracker.Blazor
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8081
      - ApiBaseUrl=http://api:8080
    networks:
      - portfolio-network

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - portfolio-network
   
  mcp-pandas:
    build:
      context: ./mcp-pandas
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    volumes:
      - ./data:/data
      - ./csv:/csv:ro
    networks:
      - portfolio-network

volumes:
  postgres_data:

networks:
  portfolio-network:
    driver: bridge
